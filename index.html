<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדיניות פרטיות ותנאי שימוש — בוא נרוץ</title>
<meta name="description" content="מדיניות הפרטיות ותנאי השימוש של בוא נרוץ עברו לאתר letsrun.co.il.">
<link rel="canonical" href="https://letsrun.co.il/privacy/">
<!-- Since round 24 the legal pages live on the site (website/privacy/, website/terms/). This page stays because the old
     github.io address mirrors it; it only points to the two new addresses. -->
<style>
  :root { --ink: #0E0E0E; --secondary: #6E6E73; --surface: #F5F5F2; --volt: #D4FF3F; --bg: #FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F4F4F0; --secondary: #A3A39D; --surface: #171716; --bg: #0B0B0A; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Heebo", -apple-system, BlinkMacSystemFont,
         "Segoe UI", "Arial Hebrew", Arial, sans-serif; font-size: 17px; line-height: 1.6; }
  main { max-width: 520px; margin: 0 auto; padding: 64px 20px 80px; }
  .logo { display: inline-flex; width: 38px; height: 24px; position: relative; margin-bottom: 28px; }
  .logo::before, .logo::after { content: ""; position: absolute; top: 0; width: 24px; height: 24px; border-radius: 50%; }
  .logo::before { right: 0; background: var(--volt); }
  .logo::after { left: 0; border: 2.4px solid var(--ink); }
  h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { margin: 0 0 28px; color: var(--secondary); }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a { display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 20px;
             border-radius: 18px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; }
  .links a span { color: var(--secondary); font-weight: 500; font-size: 14px; direction: ltr; }
  a:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
  footer { margin-top: 40px; font-size: 14px; color: var(--secondary); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <span class="logo" aria-hidden="true"></span>
  <h1>מדיניות פרטיות ותנאי שימוש</h1>
  <p>שני המסמכים של בוא נרוץ עברו לאתר שלנו.</p>
  <div class="links">
    <a href="https://letsrun.co.il/privacy/">מדיניות פרטיות <span>letsrun.co.il/privacy</span></a>
    <a href="https://letsrun.co.il/terms/">תנאי שימוש וכללי הקהילה <span>letsrun.co.il/terms</span></a>
  </div>
  <footer>שאלות: <a href="mailto:masrab11@gmail.com" dir="ltr">masrab11@gmail.com</a></footer>
</main>
</body>
</html>
